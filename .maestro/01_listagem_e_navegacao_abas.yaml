appId: com.anonymous.cryptoalert
name: "Fluxo 01 - Listagem de Criptomoedas e Navegacao entre Abas"
---
- launchApp:
    clearState: true

# Aguarda o cabecalho da tela inicial (aba List)
- extendedWaitUntil:
    visible: "Cryptocurrencies"
    timeout: 20000

# Se a API retornar ou usar os dados carregados, valida as criptomoedas principais na lista
- extendedWaitUntil:
    visible: "Bitcoin"
    timeout: 15000
- assertVisible: "BTC"
- assertVisible: "Ethereum"
- assertVisible: "ETH"

# Captura evidencia da listagem inicial
- takeScreenshot: "evidencia_01_listagem_inicial"

# Navega para a aba Convert e valida os elementos reais da tela
- tapOn: "Convert"
- assertVisible: "Convert Crypto"
- assertVisible: "Amount"
- assertVisible: "Cryptocurrency"
- assertVisible: "Bitcoin (BTC)"
- assertVisible: "Fiat Currency"
- assertVisible: "USD ($)"
- assertVisible: "Converted Amount"
- assertVisible: "Enter an amount"

# Navega para a aba Alerts e valida o estado vazio inicial
- tapOn: "Alerts"
- assertVisible: "Price Alerts"
- assertVisible: "New Alert"
- assertVisible: "No alerts yet"
- assertVisible: "Create Alert"

# Retorna para a aba List e confirma que a listagem continua visivel
- tapOn: "List"
- assertVisible: "Cryptocurrencies"
- assertVisible: "Bitcoin"
